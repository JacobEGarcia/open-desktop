<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#333333"><title>OPEN / a personal desktop</title><style>
:root{color-scheme:dark;--fg:#f0f0ed;--dim:#aaa9a6;--panel:rgba(23,23,23,.84);--edge:rgba(255,255,255,.17)}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--fg)}button,input,textarea{font:inherit}button{cursor:pointer;color:inherit}body{background:#515151 url('./13-coast.jpg') center center/cover no-repeat fixed;overflow:hidden}body:before{content:"";position:fixed;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.28),transparent 25%,rgba(0,0,0,.17) 80%,rgba(0,0,0,.27));pointer-events:none}#top{height:33px;position:relative;z-index:5;display:flex;align-items:center;gap:16px;padding:0 16px;background:rgba(27,27,27,.14);font-size:12px;font-weight:500}#top button{border:0;background:none;padding:3px 0;opacity:.84}#top button:hover,#top button.active{opacity:1}#top .mark{font-size:17px;line-height:1;margin-right:1px}#top .spacer{flex:1}#top .clock{font-variant-numeric:tabular-nums;font-size:11px;opacity:.9}.icon{width:13px;height:13px;vertical-align:-2px;display:inline-block;margin-right:5px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.utility{opacity:.8;font-size:14px}#home{position:absolute;left:50%;top:50%;transform:translate(-50%,-51%);width:min(560px,calc(100vw - 36px));text-align:center;z-index:2;transition:opacity .2s,transform .2s}#home.dim{opacity:.25;transform:translate(-50%,-55%);pointer-events:none}.eyebrow{font-size:10px;letter-spacing:.28em;text-transform:uppercase;font-weight:650;text-shadow:0 1px 4px #333;margin-bottom:14px}h1{font-size:36px;font-weight:540;letter-spacing:-.055em;line-height:1.1;margin:0 0 28px;text-shadow:0 2px 12px #333}#askform{width:min(480px,100%);height:48px;display:flex;margin:auto;border:1px solid rgba(255,255,255,.38);border-radius:28px;align-items:center;background:rgba(25,25,25,.63);backdrop-filter:blur(24px);box-shadow:0 5px 24px rgba(0,0,0,.19),inset 0 1px rgba(255,255,255,.13)}#ask{flex:1;background:none;border:0;outline:none;color:white;padding:0 18px;font-size:13px;min-width:0}#ask::placeholder{color:#d1d1d1}#askform button{border:0;background:none;margin-right:12px;font-size:17px;opacity:.65}#shortcuts{margin-top:12px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.pill{border:0;border-radius:19px;padding:8px 15px;background:rgba(23,23,23,.58);backdrop-filter:blur(16px);font-size:12px;min-width:75px;box-shadow:inset 0 1px rgba(255,255,255,.08)}.pill:hover{background:rgba(25,25,25,.83)}#foot{position:fixed;bottom:13px;left:17px;right:17px;z-index:4;display:flex;justify-content:space-between;align-items:end;font-size:10px;opacity:.86}#foot button{background:rgba(25,25,25,.52);border:0;border-radius:16px;padding:7px 11px;font-size:10px}.panel{position:absolute;z-index:3;top:12%;left:50%;transform:translateX(-50%);width:min(920px,calc(100vw - 30px));height:min(780px,88vh);display:flex;flex-direction:column;border:1px solid var(--edge);border-radius:13px;background:var(--panel);backdrop-filter:blur(36px);box-shadow:0 26px 80px rgba(0,0,0,.42);overflow:hidden}.panel.pinned{border-color:rgba(255,255,255,.38)}.panelhead{height:45px;flex-shrink:0;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--edge);padding:0 15px;font-size:12px}.panelhead .title{flex:1;font-weight:650}.panelhead button{background:none;border:0;color:var(--dim);font-size:17px;padding:4px 5px}.panelhead button:hover{color:#fff}.panelbody{overflow-y:auto;flex:1;padding:22px 24px}.panelbody h2{font-size:23px;font-weight:560;letter-spacing:-.04em;margin:0 0 8px}.muted{color:var(--dim);font-size:12px;line-height:1.6}.row{display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--edge);padding:13px 0;font-size:13px}.row .grow{flex:1}.row button,.action{border:1px solid var(--edge);border-radius:7px;background:rgba(255,255,255,.08);padding:7px 11px;font-size:12px}.row button:hover,.action:hover{background:rgba(255,255,255,.17)}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.field{border:1px solid var(--edge);border-radius:8px;background:rgba(0,0,0,.19);color:var(--fg);padding:11px 12px;outline:0;width:100%;font-size:13px}.field:focus{border-color:#aaa}textarea.field{resize:vertical;line-height:1.6;min-height:190px}.two{display:grid;grid-template-columns:190px 1fr;gap:20px}.navlist{border-right:1px solid var(--edge);padding-right:15px}.navitem{display:block;width:100%;border:0;border-radius:6px;background:transparent;text-align:left;padding:10px 8px;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.navitem:hover,.navitem.sel{background:rgba(255,255,255,.1)}.link{color:#eee;text-decoration:none;border-bottom:1px solid #888}.hint{font-size:11px;opacity:.75;line-height:1.5}#toast{position:fixed;bottom:46px;left:50%;transform:translateX(-50%);z-index:20;background:#252525;border:1px solid var(--edge);border-radius:8px;padding:10px 16px;font-size:12px;opacity:0;pointer-events:none;transition:opacity .2s}#toast.show{opacity:1}#fileinput{display:none}@media(max-width:650px){#top{gap:10px;padding:0 10px}#top .navextra{display:none}#top .clock{font-size:10px}h1{font-size:30px}.panel{top:8%;height:min(660px,80vh)}.panelbody{padding:18px 16px}.two{grid-template-columns:120px 1fr;gap:12px}.navlist{padding-right:6px}}
.companion-state{font-size:11px;color:#c5c5c2;margin:8px 0 15px}.companion-state.good{color:#b9d9c3}.companion-layout{display:grid;grid-template-columns:1fr 1fr;gap:18px}.companion-layout .field{margin:5px 0 10px}.companion-output{white-space:pre-wrap;word-break:break-word;line-height:1.6;font-size:13px;max-height:200px;overflow:auto;padding:14px;border:1px solid var(--edge);border-radius:9px;background:rgba(0,0,0,.18)}.companion-output:empty{display:none}.companion-label{font-size:11px;color:var(--dim);display:block}.companion-list{max-height:170px;overflow:auto}.companion-list button{display:block;width:100%;text-align:left;background:transparent;border:0;padding:8px;border-bottom:1px solid var(--edge);font-size:12px}.companion-list button:hover{background:rgba(255,255,255,.1)}#confirmwrite{background:#e5e5df;color:#202020;border-color:transparent}#confirmwrite:disabled,#confirmcontrol:disabled{opacity:.5}.control-shot{display:block;max-width:100%;max-height:250px;object-fit:contain;border:1px solid var(--edge);border-radius:8px;margin:12px 0}.control-shot:empty{display:none}.control-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.control-grid .field{margin:0}.control-review{white-space:pre-wrap;word-break:break-word;background:#222;border:1px solid #666;padding:12px;border-radius:7px;margin:12px 0} @media(max-width:650px){.companion-layout{grid-template-columns:1fr}.panel{height:min(700px,84vh)}}
</style></head><body><header id="top"><button class="mark" data-open="home" aria-label="Home">▲</button><button data-open="home">Desktop</button><button class="navextra" data-open="browser">Browser</button><button class="navextra" data-open="files">Files</button><button class="navextra" data-open="notes">Notes</button><button class="navextra" data-open="apps">Apps</button><button data-open="companion">AI + computer</button><span class="spacer"></span><button class="utility" data-open="search" aria-label="Search">⌕</button><button class="utility" data-open="files" aria-label="Files">▢</button><button class="utility" data-open="settings" aria-label="Settings">☷</button><span class="clock" id="clock"></span></header><main id="home"><div class="eyebrow" id="today"></div><h1 id="greeting">Good morning.</h1><form id="askform"><input id="ask" autocomplete="off" aria-label="Ask desktop" placeholder="Ask anything"><button type="submit" aria-label="Submit">↗</button></form><div id="shortcuts"><button class="pill" data-open="files">▱ &nbsp;Files</button><button class="pill" data-open="browser">◎ &nbsp;Browser</button><button class="pill" data-open="notes">▤ &nbsp;Notes</button><button class="pill" data-open="apps">⊞ &nbsp;Apps</button><button class="pill" data-open="companion">✳ &nbsp;AI + computer</button></div></main><section id="panels"></section><div id="toast" role="status"></div><footer id="foot"><span>Along the coast · <a class="link" href="https://commons.wikimedia.org/wiki/File:Sea_Stacks_on_Oregon_Coast.jpg" target="_blank" rel="noopener">NOAA / Michael Theberge</a></span><button id="shuffle">⇄ &nbsp;Shift wallpaper</button></footer><input id="fileinput" type="file" multiple><script>
'use strict';const $=s=>document.querySelector(s), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const load=(k,d)=>{try{return JSON.parse(localStorage.getItem('open-'+k))??d}catch{return d}},save=(k,v)=>localStorage.setItem('open-'+k,JSON.stringify(v));let notes=load('notes',[{id:1,title:'Welcome to your desktop',body:'A small, personal space that belongs to you.\n\nTry: “create note Weekend ideas” or “open files”. Notes and text files are saved in this browser, on this device.',modified:Date.now()}]),files=load('files',[]),pins=load('pins',[]),activeNote=notes[0]?.id, panel=null;const icons={files:'▱',browser:'◎',notes:'▤',apps:'⊞',settings:'☷',calculator:'=',clock:'◷',help:'?',companion:'✳'};function stamp(){let d=new Date(),h=d.getHours();$('#today').textContent=new Intl.DateTimeFormat('en-US',{weekday:'long',month:'long',day:'numeric'}).format(d);$('#clock').textContent=new Intl.DateTimeFormat('en-US',{weekday:'short',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}).format(d);$('#greeting').textContent=`Good ${h<12?'morning':h<17?'afternoon':'evening'}.`}stamp();setInterval(stamp,30000);function toast(t){$('#toast').textContent=t;$('#toast').classList.add('show');clearTimeout(window._to);window._to=setTimeout(()=>$('#toast').classList.remove('show'),2500)}function close(){document.getElementById('panels').innerHTML='';panel=null;$('#home').classList.remove('dim')}function open(type){if(type==='home'){close();return}panel=type;$('#home').classList.add('dim');let box=$('#panels');box.innerHTML=`<article class="panel ${pins.includes(type)?'pinned':''}" role="dialog" aria-label="${type}"><div class="panelhead"><span class="title">${icons[type]||'○'} &nbsp;${type[0].toUpperCase()+type.slice(1)}</span><button id="pin" title="${pins.includes(type)?'Unpin':'Keep this view'}">${pins.includes(type)?'●':'○'}</button><button id="dismiss" title="Close">×</button></div><div class="panelbody" id="content"></div></article>`;$('#pin').onclick=()=>{pins=pins.includes(type)?pins.filter(x=>x!==type):[...pins,type];save('pins',pins);$('#pin').textContent=pins.includes(type)?'●':'○';$('.panel').classList.toggle('pinned',pins.includes(type));toast(pins.includes(type)?'View kept on this device':'View unpinned')};$('#dismiss').onclick=close;render(type)}function render(type){let el=$('#content');if(!el)return; if(type==='notes')renderNotes(el);else if(type==='files')renderFiles(el);else if(type==='browser')renderBrowser(el);else if(type==='apps')renderApps(el);else if(type==='settings')renderSettings(el);else if(type==='companion')renderCompanion(el);else if(type==='calculator')renderCalculator(el);else if(type==='clock')el.innerHTML='<h2>Local time</h2><p class="muted">'+new Date().toLocaleString()+'</p>';else if(type==='help')el.innerHTML='<h2>Make it yours.</h2><p class="muted">Try “open notes”, “create note Ideas”, “find [text]”, “save file name: content”, “calculate 12 * 7”, or “search web for typography”. These commands run locally. AI and narrow real file access require the local companion running on your own computer.</p>';else if(type==='search'){$('#content').innerHTML='<h2>Ask your desktop</h2><p class="muted">Enter a local command. Try “open notes” or “create note Ideas”.</p><input class="field" id="panelask" placeholder="What would you like to do?">';$('#panelask').onkeydown=e=>{if(e.key==='Enter')command(e.target.value)}}}
function renderNotes(el){if(!notes.some(n=>n.id===activeNote))activeNote=notes[0]?.id;let n=notes.find(x=>x.id===activeNote);el.innerHTML=`<div class="two"><div class="navlist"><button class="action" id="newnote">+ New note</button><div style="margin-top:15px">${notes.map(x=>`<button class="navitem ${x.id===activeNote?'sel':''}" data-note="${x.id}">${esc(x.title||'Untitled')}</button>`).join('')}</div></div><div>${n?`<input class="field" id="notetitle" aria-label="Note title" value="${esc(n.title)}" placeholder="Untitled"><p class="hint" id="saved">Saved on this device · ${new Date(n.modified).toLocaleDateString()}</p><textarea class="field" id="notebody" aria-label="Note body" placeholder="Start writing...">${esc(n.body)}</textarea><div class="actions"><button class="action" id="exportnote">Download .txt</button><button class="action" id="deletenote">Delete note</button></div>`:'<h2>Your notes</h2><p class="muted">A place to put thoughts and keep them.</p>'}</div></div>`;$('#newnote').onclick=()=>createNote('Untitled');el.querySelectorAll('[data-note]').forEach(b=>b.onclick=()=>{activeNote=Number(b.dataset.note);renderNotes(el)});if(n){let update=()=>{n.title=$('#notetitle').value;n.body=$('#notebody').value;n.modified=Date.now();save('notes',notes);$('#saved').textContent='Saved on this device · just now';el.querySelector(`[data-note="${n.id}"]`).textContent=n.title||'Untitled'};$('#notetitle').oninput=update;$('#notebody').oninput=update;$('#exportnote').onclick=()=>download((n.title||'note')+'.txt',n.body);$('#deletenote').onclick=()=>{if(!confirm('Delete this note from this browser?'))return;notes=notes.filter(x=>x.id!==n.id);save('notes',notes);activeNote=notes[0]?.id;renderNotes(el)}}}
function createNote(title,body=''){let n={id:Date.now(),title,body,modified:Date.now()};notes.unshift(n);activeNote=n.id;save('notes',notes);open('notes');$('#notetitle').focus();$('#notetitle').select();toast('Note created')}
function download(name,text){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([text],{type:'text/plain;charset=utf-8'}));a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}function renderFiles(el){el.innerHTML=`<h2>Files</h2><p class="muted">Your text files stay in this browser. Import .txt, .md, .json, or .csv files up to 1 MB each.</p><div class="actions"><button class="action" id="newfile">+ New text file</button><button class="action" id="upload">Import text</button></div><div id="filelist">${files.length?files.map(f=>`<div class="row"><span>▱</span><span class="grow">${esc(f.name)}<br><span class="muted">${new Date(f.modified).toLocaleDateString()} · ${f.content.length} characters</span></span><button data-edit="${f.id}">Open</button><button data-export="${f.id}">↓</button><button data-remove="${f.id}">×</button></div>`).join(''):'<p class="muted">No files yet.</p>'}</div><div id="fileeditor"></div>`;$('#newfile').onclick=()=>{let name=prompt('Name your text file','untitled.txt');if(!name)return;let f={id:Date.now(),name,content:'',modified:Date.now()};files.unshift(f);save('files',files);renderFiles(el);editFile(f.id)};$('#upload').onclick=()=>$('#fileinput').click();el.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>editFile(Number(b.dataset.edit)));el.querySelectorAll('[data-export]').forEach(b=>b.onclick=()=>{let f=files.find(x=>x.id==b.dataset.export);download(f.name,f.content)});el.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{if(!confirm('Delete this file from this browser?'))return;files=files.filter(x=>x.id!=b.dataset.remove);save('files',files);renderFiles(el)})}function editFile(id){let f=files.find(x=>x.id===id);if(!f)return;$('#fileeditor').innerHTML=`<div class="row"><strong class="grow">${esc(f.name)}</strong><button id="donefile">Done</button></div><textarea id="filebody" class="field" aria-label="File content">${esc(f.content)}</textarea><p class="hint">Edits save as you type.</p>`;$('#filebody').oninput=e=>{f.content=e.target.value;f.modified=Date.now();save('files',files)};$('#donefile').onclick=()=>renderFiles($('#content'));$('#fileeditor').scrollIntoView({behavior:'smooth'})}$('#fileinput').onchange=async e=>{for(let f of e.target.files){if(f.size>1048576||!(/\.(txt|md|json|csv|js|html|css)$/i).test(f.name)){toast('Only text files up to 1 MB');continue}files.unshift({id:Date.now()+Math.random(),name:f.name,content:await f.text(),modified:Date.now()})}try{save('files',files);renderFiles($('#content'));toast('Imported locally')}catch{toast('Browser storage is full; file not saved')}e.target.value=''};
function renderBrowser(el){el.innerHTML=`<h2>Browser</h2><p class="muted">Open a site in a separate tab. Browser security prevents this desktop from controlling other tabs.</p><form id="browseform" class="actions"><input class="field" id="url" placeholder="A web address or search" aria-label="Web address" style="flex:1"><button class="action">Go ↗</button></form><div class="row"><span class="grow">Wikipedia</span><a class="link" href="https://www.wikipedia.org/" target="_blank" rel="noopener">Open ↗</a></div><div class="row"><span class="grow">Internet Archive</span><a class="link" href="https://archive.org/" target="_blank" rel="noopener">Open ↗</a></div><div class="row"><span class="grow">GitHub</span><a class="link" href="https://github.com/" target="_blank" rel="noopener">Open ↗</a></div>`;$('#browseform').onsubmit=e=>{e.preventDefault();let v=$('#url').value.trim();if(!v)return;let url=/^https?:\/\//i.test(v)?v:/^[\w.-]+\.[a-z]{2,}(\/.*)?$/i.test(v)?'https://'+v:'https://www.google.com/search?q='+encodeURIComponent(v);window.open(url,'_blank','noopener,noreferrer')}}function renderApps(el){el.innerHTML='<h2>Apps</h2><p class="muted">Small tools for your space. Open what you need and close it when you are done.</p>'+[['notes','Write and keep thoughts'],['files','Store local text files'],['browser','Visit the open web'],['calculator','Quick arithmetic'],['clock','Your local time'],['help','Commands and scope'],['companion','Local model and computer workspace']].map(([x,d])=>`<div class="row"><span>${icons[x]}</span><span class="grow">${x[0].toUpperCase()+x.slice(1)}<br><span class="muted">${d}</span></span><button data-app="${x}">Open</button></div>`).join('');el.querySelectorAll('[data-app]').forEach(b=>b.onclick=()=>open(b.dataset.app))}function renderSettings(el){el.innerHTML='<h2>Your desktop</h2><p class="muted">A local web prototype of an open personal desktop. Notes, imported text and pinned views use browser storage. Nothing is sent to a server by the app. The optional local companion can talk to a model running on this computer and work with text files in a dedicated OPEN Workspace. On Windows, each app launch, URL, click, typed text, and keypress requires its own visible review and confirmation. No shell, background automation or other folders.</p><div class="row"><span class="grow">Notes</span><span>'+notes.length+'</span></div><div class="row"><span class="grow">Local text files</span><span>'+files.length+'</span></div><div class="row"><span class="grow">Kept views</span><span>'+pins.length+'</span></div><button class="action" id="clearall" style="margin-top:22px">Erase local desktop data</button><p class="hint">Wallpaper: NOAA Photo Library, Michael Theberge, via Wikimedia Commons. Public domain.</p>';$('#clearall').onclick=()=>{if(!confirm('Erase all notes, files, and pinned views from this browser?'))return;['notes','files','pins'].forEach(k=>localStorage.removeItem('open-'+k));notes=[];files=[];pins=[];renderSettings(el);toast('Local data erased')}}function renderCalculator(el){el.innerHTML='<h2>Calculator</h2><p class="muted">Basic arithmetic, evaluated locally.</p><form id="calcform" class="actions"><input id="expression" class="field" style="flex:1" placeholder="(18 + 24) / 2" aria-label="Expression"><button class="action">Calculate</button></form><h2 id="answer"></h2>';$('#calcform').onsubmit=e=>{e.preventDefault();$('#answer').textContent=calc($('#expression').value)}}function calc(s){if(!/^[\d\s.+*/()%\-]+$/.test(s)||s.length>100)return 'Use numbers and + - * / ( ) only';try{let r=Function('"use strict";return ('+s+')')();return Number.isFinite(r)?String(r):'Not a finite number'}catch{return 'Check your expression'}}
function command(raw){let s=raw.trim(),m;if(!s)return;$('#ask').value='';if((m=s.match(/^(open|show|launch)\s+(notes?|files?|browser|apps?|calculator|clock|settings|help|companion)$/i)))return open(({note:'notes',file:'files',app:'apps'})[m[2].toLowerCase()]||m[2].toLowerCase());if((m=s.match(/^(create|new|make)\s+(a\s+)?note\s*(.*)$/i)))return createNote(m[3]||'Untitled');if((m=s.match(/^(find|search)\s+(notes?\s+for\s+)?(.+)$/i))){let q=m[3].toLowerCase(),res=notes.filter(n=>(n.title+' '+n.body).toLowerCase().includes(q));open('notes');if(res.length){activeNote=res[0].id;renderNotes($('#content'));toast(`${res.length} note${res.length===1?'':'s'} found`)}else toast('No matching notes on this device');return}if((m=s.match(/^save file\s+([^:]+):\s*(.*)$/i))){files.unshift({id:Date.now(),name:m[1].trim(),content:m[2],modified:Date.now()});save('files',files);open('files');toast('Text file saved locally');return}if((m=s.match(/^(calculate|calc)\s+(.+)/i))){open('calculator');$('#expression').value=m[2];$('#answer').textContent=calc(m[2]);return}if((m=s.match(/^(search web for|web search)\s+(.+)/i))){open('browser');$('#url').value=m[2];$('#browseform').requestSubmit();return}if(/^(what time|time|date)\??$/i.test(s))return open('clock');open('companion');$('#chatprompt').value=s;toast('Connect your local model to ask this')}

const companionBase='http://127.0.0.1:18183', companionKey=()=>sessionStorage.getItem('open-companion-key')||'';
async function companionCall(endpoint,method='GET',payload){let response=await fetch(companionBase+endpoint,{method,headers:{'Authorization':'Bearer '+companionKey(),...(payload?{'Content-Type':'application/json'}:{})},body:payload?JSON.stringify(payload):undefined});let data=await response.json();if(!response.ok)throw Error(data.error||'Local companion unavailable');return data}
let pendingWrite=null;
function renderCompanion(el){pendingWrite=null;el.innerHTML=`<h2>A little more horsepower.</h2><p class="muted">A local model for questions, and real text files in a dedicated workspace on this computer. On Windows this can also launch approved apps, open URLs in Edge, and send one click, text, or keypress at a time after a visible preview and confirmation. It has no shell or autonomous action loop. Your question goes to the local model only when you press Ask.</p><div id="localstate" class="companion-state">Not connected</div><div id="systemstate" class="companion-state"></div><div class="companion-layout"><section><label class="companion-label" for="localkey">Session key from your companion terminal</label><input id="localkey" class="field" type="password" autocomplete="off" placeholder="Paste session key"><button id="connectlocal" class="action">Connect</button><button id="forgetlocal" class="action">Forget key</button></section></div><section style="margin:14px 0 26px"><h3>Computer controls · one step at a time</h3><p class="hint">Windows Z13 only. Refresh the screen, then choose an action or ask the local model to propose one. The model cannot act on its own. Check every preview, especially clicks, typed text and external sites; confirm only what you intend. OPEN cannot tell if a click will send, delete, or buy.</p><button class="action" id="refreshscreen">Refresh screen</button><span id="foreground" class="companion-state"></span><img id="controlshot" class="control-shot" alt="Current computer screen"><label class="companion-label" for="controlgoal">Ask model for one suggested action</label><input class="field" id="controlgoal" placeholder="Open Notepad"><button class="action" id="suggestcontrol">Suggest next step</button><div class="control-grid"><select id="controltype" class="field" aria-label="Action"><option value="app">Launch app</option><option value="url">Open URL in Edge</option><option value="click">Click coordinates</option><option value="type">Type text</option><option value="key">Press key</option></select><input id="controlvalue" class="field" placeholder="Notepad" aria-label="App, URL, text, key, or x,y"></div><p class="hint">Apps: Notepad, Calculator, Files, Edge. Keys: Enter, Escape, Tab, Backspace, arrows, Home, End, PageUp, PageDown, Ctrl+L/F/A/S/Z. For a click enter x,y coordinates from the screen.</p><button class="action" id="previewcontrol">Preview one action</button><div id="controlreview" class="control-review" role="status">No action pending.</div><button class="action" id="confirmcontrol" disabled>Confirm this action</button></section><div class="companion-layout"><section><p class="hint">On the Z13, run companion/start-windows.cmd from the downloaded project. The key stays in this tab session, never in the repository. The hosted page may ask permission to reach your local computer.</p><h3>Ask your model</h3><textarea id="chatprompt" class="field" rows="3" placeholder="What should I plan next?"></textarea><button id="asklocal" class="action">Ask</button><div id="chatanswer" class="companion-output" aria-live="polite"></div></section><section><h3>Computer workspace</h3><p class="hint">List, read and save small text files in OPEN Workspace. A save needs a second click after its preview. No delete button.</p><button id="listlocal" class="action">List files</button><div id="localfiles" class="companion-list"></div><label class="companion-label" for="filename">File name</label><input id="filename" class="field" placeholder="idea.md"><label class="companion-label" for="filetext">Text</label><textarea id="filetext" class="field" rows="5" placeholder="Write here..."></textarea><button id="previewwrite" class="action">Preview save</button><div id="writepreview" class="companion-state" aria-live="polite"></div><button id="confirmwrite" class="action" disabled>Confirm save</button></section></div>`;
$('#localkey').value=companionKey();let state=$('#localstate'), preview=$('#writepreview');let status=async()=>{try{let d=await companionCall('/api/status');state.className='companion-state good';state.textContent='Connected · '+(d.modelReady?'model '+d.model:'no local model responding')+' · workspace '+d.workspace;let m=await companionCall('/api/system');$('#systemstate').textContent='This computer: '+m.device+' · '+m.platform+' · '+m.memoryFreeGiB+' / '+m.memoryTotalGiB+' GiB memory free · up '+Math.floor(m.uptimeSeconds/3600)+'h'}catch(e){state.className='companion-state';state.textContent='Not connected · '+e.message}};
$('#connectlocal').onclick=()=>{sessionStorage.setItem('open-companion-key',$('#localkey').value.trim());status()};$('#forgetlocal').onclick=()=>{sessionStorage.removeItem('open-companion-key');$('#localkey').value='';state.textContent='Not connected';$('#chatanswer').textContent=''};
$('#asklocal').onclick=async()=>{let b=$('#asklocal');b.disabled=true;$('#chatanswer').textContent='Thinking on this computer...';try{let d=await companionCall('/api/chat','POST',{message:$('#chatprompt').value});$('#chatanswer').textContent=d.reply+'\n\nModel: '+d.model}catch(e){$('#chatanswer').textContent=e.message}finally{b.disabled=false}};
$('#listlocal').onclick=async()=>{try{let d=await companionCall('/api/files');$('#localfiles').replaceChildren();for(let name of d.files){let b=document.createElement('button');b.textContent=name;b.onclick=async()=>{try{let f=await companionCall('/api/file?name='+encodeURIComponent(name));$('#filename').value=f.name;$('#filetext').value=f.content;preview.textContent='Loaded '+name+' from this computer';pendingWrite=null;$('#confirmwrite').disabled=true}catch(e){preview.textContent=e.message}};$('#localfiles').append(b)}if(!d.files.length)$('#localfiles').textContent='No text files yet.'}catch(e){$('#localfiles').textContent=e.message}};
$('#previewwrite').onclick=async()=>{pendingWrite=null;$('#confirmwrite').disabled=true;try{let d=await companionCall('/api/prepare','POST',{name:$('#filename').value,content:$('#filetext').value});pendingWrite={...d,name:$('#filename').value,content:$('#filetext').value};preview.textContent=d.action+' '+d.name+' ('+d.bytes+' bytes) in OPEN Workspace. Review the text above, then confirm within 60 seconds.';$('#confirmwrite').disabled=false}catch(e){preview.textContent=e.message}};
$('#confirmwrite').onclick=async()=>{if(!pendingWrite)return;let p=pendingWrite;pendingWrite=null;$('#confirmwrite').disabled=true;if($('#filename').value!==p.name||$('#filetext').value!==p.content){preview.textContent='Text changed since preview. Preview again.';return}try{let d=await companionCall('/api/commit','POST',{approval:p.approval});preview.textContent='Saved '+d.saved+' on this computer.'}catch(e){preview.textContent=e.message}};
let controlPending=null,shotUrl=null;
const actionFromForm=()=>{let type=$('#controltype').value,v=$('#controlvalue').value;if(type==='app')return {type,app:v.trim()};if(type==='url')return {type,url:v.trim()};if(type==='click'){let [x,y]=v.split(',').map(Number);return {type,x,y}}if(type==='type')return {type,text:v};return {type,key:v.trim()}};
const clearControl=()=>{controlPending=null;$('#confirmcontrol').disabled=true};
$('#controltype').onchange=()=>{clearControl();$('#controlvalue').value='';$('#controlvalue').placeholder=({app:'Notepad',url:'https://example.com',click:'x,y',type:'Text to type',key:'Ctrl+L'})[$('#controltype').value]};
$('#controlvalue').oninput=clearControl;
$('#refreshscreen').onclick=async()=>{clearControl();let img=$('#controlshot');$('#foreground').textContent='Refreshing...';try{let d=await companionCall('/api/foreground');$('#foreground').textContent='Focused: '+d.title+' · '+d.screen.width+' × '+d.screen.height+' at '+d.screen.left+','+d.screen.top;let r=await fetch(companionBase+'/api/screen',{headers:{Authorization:'Bearer '+companionKey()}});if(!r.ok)throw Error('Screenshot unavailable');let url=URL.createObjectURL(await r.blob());if(shotUrl)URL.revokeObjectURL(shotUrl);shotUrl=url;img.src=url}catch(e){$('#foreground').textContent=e.message}};
$('#suggestcontrol').onclick=async()=>{clearControl();$('#controlreview').textContent='Asking the local model for one suggestion...';try{let d=await companionCall('/api/action/plan','POST',{goal:$('#controlgoal').value});let a=d.action;$('#controltype').value=a.type;$('#controlvalue').value=a.app||a.url||(a.type==='click'?a.x+','+a.y:a.text||a.key);$('#controlreview').textContent='Model suggestion: '+d.description+'\nFocused then: '+d.foreground+'\nThis is not executed. Check it and press Preview one action.'}catch(e){$('#controlreview').textContent=e.message}};
$('#previewcontrol').onclick=async()=>{clearControl();try{let action=actionFromForm(),d=await companionCall('/api/action/prepare','POST',action);controlPending={approval:d.approval,action};$('#controlreview').textContent='PREVIEW - '+d.description+'\nFocused window: '+d.foreground+'\nThis may have consequences in the target app. Confirm within 60 seconds only if you intend the exact action.';$('#confirmcontrol').disabled=false}catch(e){$('#controlreview').textContent=e.message}};
$('#confirmcontrol').onclick=async()=>{let p=controlPending;clearControl();if(!p)return;if(JSON.stringify(actionFromForm())!==JSON.stringify(p.action)){$('#controlreview').textContent='Action changed. Preview again.';return}try{let d=await companionCall('/api/action/commit','POST',{approval:p.approval});$('#controlreview').textContent='Done: '+d.done+'\nRefresh screen to see the result.'}catch(e){$('#controlreview').textContent=e.message}};
if(companionKey())status();}

$('#askform').onsubmit=e=>{e.preventDefault();command($('#ask').value)};document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>open(b.dataset.open));document.addEventListener('keydown',e=>{if(e.key==='Escape')close();if((e.metaKey||e.ctrlKey)&&e.key==='k'){e.preventDefault();close();$('#ask').focus()}});let shift=0;$('#shuffle').onclick=()=>{shift=(shift+1)%3;document.body.style.backgroundPosition=['center center','left center','right center'][shift];toast('Wallpaper shifted')};if(pins.length)open(pins[pins.length-1]);
</script></body></html>
